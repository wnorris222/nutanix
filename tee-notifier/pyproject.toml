[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teewatch"
version = "0.1.0"
description = "Watch a TeeItUp golf booking site and get notified when tee times open up"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7.0", "playwright>=1.40"]

[project.scripts]
teewatch = "teewatch.cli:main"

[tool.setuptools.packages.find]
include = ["teewatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
